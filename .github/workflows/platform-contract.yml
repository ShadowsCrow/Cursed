name: Contrato da plataforma

on:
  push:
    paths:
      - "cursed_platform/**"
      - "platform/api/**"
      - "platform/frontend/**"
      - "platform/migration/**"
      - ".github/workflows/platform-contract.yml"
  pull_request:
    paths:
      - "cursed_platform/**"
      - "platform/api/**"
      - "platform/frontend/**"
      - "platform/migration/**"
      - ".github/workflows/platform-contract.yml"

jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: python -m pip install -r cursed_platform/requirements.txt
      - run: python -m cursed_platform.export_openapi --check
      - run: npm ci
        working-directory: platform/frontend
      - run: npm run check:client
        working-directory: platform/frontend
      - run: npm run probe:incompatible
        working-directory: platform/frontend
      - run: npm run typecheck
        working-directory: platform/frontend
      - run: npm run lint
        working-directory: platform/frontend
      - run: npm run build
        working-directory: platform/frontend
      - run: npm test
        working-directory: platform/frontend
