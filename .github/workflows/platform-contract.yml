name: Verificação da plataforma

on:
  push:
    paths:
      - "cursed_platform/**"
      - "platform/api/**"
      - "platform/frontend/**"
      - "platform/migration/**"
      - ".github/workflows/platform-contract.yml"
  pull_request:
    paths:
      - "cursed_platform/**"
      - "platform/api/**"
      - "platform/frontend/**"
      - "platform/migration/**"
      - ".github/workflows/platform-contract.yml"

jobs:
  plataforma:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CURSED_TEST_POSTGRES_URL: postgresql+psycopg://postgres:teste@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: python -m pip install -r cursed_platform/requirements.txt
      - run: python -m compileall -q cursed_platform platform/api
      - name: Migrações Alembic
        run: python -m unittest cursed_platform.tests.test_migration_base cursed_platform.tests.test_ensaio_migracao
      - name: Segurança de recursos privados
        run: python -m unittest cursed_platform.tests.test_acesso_privado
      - run: python -m unittest discover -s cursed_platform/tests -t .
      - run: python -m cursed_platform.export_openapi --check
      - run: npm ci
        working-directory: platform/frontend
      - run: npm run check:client
        working-directory: platform/frontend
      - run: npm run probe:incompatible
        working-directory: platform/frontend
      - run: npm run typecheck
        working-directory: platform/frontend
      - run: npm run lint -- --max-warnings 0
        working-directory: platform/frontend
      - run: npm run build
        working-directory: platform/frontend
      - run: npm test
        working-directory: platform/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: platform/frontend
      - run: npm run test:e2e
        working-directory: platform/frontend
