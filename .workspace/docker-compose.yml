name: cursed

services:
  db:
    image: postgres:16
    container_name: cursed-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cursed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: .workspace/Dockerfile
    container_name: cursed-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CURSED_DATABASE_URL: ${CURSED_DATABASE_URL}
      STREAMLIT_SERVER_PORT: ${STREAMLIT_SERVER_PORT:-8501}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cursed_postgres_data:
