<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Moldura fina dos quadros da Personalidade (reformular-personalidade-da-ficha, D4), em 9 fatias de 24 px para
    border-image: filete duplo no alto e embaixo, simples nos lados, e em cada canto uma curva com espiral e
    bolinhas onde encosta nos filetes (referencia/quadro-grupo-canto.png).
  -->
  <defs>
    <g id="canto" fill="none" stroke="#b8905c" stroke-linecap="round">
      <path d="M1.5 24V21C1.5 12 6 6 12 4.5 15 3.2 18.5 2 21 1.5H24" stroke-width="1.1"/>
      <path d="M21 4.5H24" stroke-width="0.9"/>
      <path d="M20 5.5C13 6 8.5 8.5 7.8 12.5 7.2 16 11 17.2 12.8 14.6 14 12.8 12 11.2 10.6 12.6" stroke-width="1"/>
      <circle cx="21" cy="3" r="1.7" fill="#f2dcb4" stroke-width="1"/>
      <circle cx="3" cy="21" r="1.7" fill="#f2dcb4" stroke-width="1"/>
    </g>
  </defs>
  <g fill="none" stroke="#b8905c">
    <path d="M24 1.5H40M24 62.5H40" stroke-width="1.1"/>
    <path d="M24 4.5H40M24 59.5H40" stroke-width="0.7" stroke-opacity=".8"/>
    <path d="M1.5 24V40M62.5 24V40" stroke-width="1.1"/>
  </g>
  <use xlink:href="#canto"/>
  <use xlink:href="#canto" transform="translate(64 0) scale(-1 1)"/>
  <use xlink:href="#canto" transform="translate(0 64) scale(1 -1)"/>
  <use xlink:href="#canto" transform="translate(64 64) scale(-1 -1)"/>
</svg>
